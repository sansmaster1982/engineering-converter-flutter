name: Build Flutter app (Android + iOS)

on:
  workflow_dispatch:
    inputs:
      upload_ios:
        description: 'Build signed iOS IPA and upload it to App Store Connect (TestFlight)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
  push:
    branches: [master]
    paths: ['flutter_app/**', '.github/workflows/build-flutter.yml']

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: flutter_app }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK + AAB
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: flutter_app }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # Release signing: keystore (base64) and passwords from repository secrets.
      # Without the secrets the build falls back to the debug key (fine for CI checks).
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-key.jks
            printf 'storeFile=release-key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
            echo "Release signing configured"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: building with the debug key"
          fi

      - run: flutter build apk --release
      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            flutter_app/build/app/outputs/flutter-apk/app-release.apk
            flutter_app/build/app/outputs/bundle/release/app-release.aab

  ios:
    name: iOS signed IPA + App Store Connect upload
    needs: test
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.upload_ios == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run: { working-directory: flutter_app }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter doctor -v

      - name: Set keychain path
        run: echo "KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db" >> "$GITHUB_ENV"

      - name: Install Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          PP_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PP_UUID".mobileprovision
          echo "Installed profile '$PP_NAME' ($PP_UUID)"
          echo "=== Signing identities ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build signed IPA
        run: |
          # Build number must grow with every upload of the same version.
          BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))
          echo "Build number: $BUILD_NUMBER"
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=ios/ExportOptions.plist
          echo "=== IPA ==="
          ls -la build/ios/ipa/
          IPA_FILE=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "IPA_FILE=$PWD/$IPA_FILE" >> "$GITHUB_ENV"
          echo "=== Embedded Info.plist ==="
          unzip -p "$IPA_FILE" 'Payload/*.app/Info.plist' > "$RUNNER_TEMP/Info.plist"
          plutil -p "$RUNNER_TEMP/Info.plist" | grep -E "CFBundle(Identifier|ShortVersionString|Version|DisplayName)"

      - name: Upload IPA to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" > ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          echo "Uploading $IPA_FILE"
          xcrun altool --upload-app --type ios --file "$IPA_FILE" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ipa-${{ github.run_number }}
          path: flutter_app/build/ios/ipa/*.ipa
          if-no-files-found: warn

      - name: Clean up keychain and keys
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -rf ~/private_keys || true
